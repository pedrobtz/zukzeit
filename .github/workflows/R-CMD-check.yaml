# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # `torch: true` installs the LibTorch runtime so the native model
          # tests actually execute. The other jobs deliberately run without it:
          # CRAN's machines will not have LibTorch either, so those jobs are the
          # standing proof that the suite skips cleanly instead of erroring.
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release', torch: true}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # LibTorch and LibLantern ship separately from the torch R package and are
      # not installed by setup-r-dependencies. Without this step every test that
      # touches a tensor skips, so the native port would be untested on CI.
      # Explicit rather than TORCH_INSTALL=1 so the download is a named step
      # whose failure is visible instead of surfacing later as a load error.
      - name: Install the LibTorch runtime
        if: matrix.config.torch
        run: Rscript -e 'torch::install_torch()'
        shell: bash

      # Note that no job here sets ZUK_RUN_CHECKPOINT_TEST. R CMD check stays
      # network-free and CRAN-shaped on every configuration; the checkpoint gate
      # is the separate `parity` job below, so a failed 925 MB download can never
      # be mistaken for a failed package check.
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Real-checkpoint parity on every push, using the small model. Toto's
  # checkpoint is 16 MB against TimesFM's 925 MB and Chronos-2's 478 MB, so this
  # costs almost nothing and closes the window where a pull request could break
  # numerical correctness and only find out after merging. The full 1.4 GB gate
  # below still runs on main.
  parity-small:
    runs-on: ubuntu-latest
    name: numerical parity (small checkpoint)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Job-level, so the key-derivation script, the prefetch, and the suite
      # all agree on which tier is running without repeating the value.
      ZUK_RUN_CHECKPOINT_TEST: 'toto2'

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check

      - name: Install the LibTorch runtime
        run: Rscript -e 'torch::install_torch()'

      # Both the cache key and the prefetch list come from the catalogue, so a
      # revision bump in R invalidates the cache on its own. Hand-copying SHAs
      # into YAML is what left the key naming one checkpoint while three were
      # being downloaded.
      - name: Derive the cache key and download list from the catalogue
        id: checkpoints
        run: Rscript .github/scripts/checkpoint-tier.R >> "$GITHUB_OUTPUT"

      - name: Cache the pinned checkpoints
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.checkpoints.outputs.key }}

      # Explicit, and before the tests, so a Hub outage or a size mismatch
      # fails here with a download error instead of surfacing as a parity
      # failure.
      - name: Prefetch the checkpoints
        run: Rscript -e 'pkgload::load_all("."); for (id in strsplit("${{ steps.checkpoints.outputs.ids }}", ",")[[1]]) zuk_download(id)'

      # The tier is set at job level, so this is the same command the full gate
      # runs; only ZUK_RUN_CHECKPOINT_TEST differs between the two jobs.
      - name: Run the checkpoint-gated suite
        run: Rscript -e 'testthat::test_local(".", stop_on_failure = TRUE)'

  # The numerical-parity gate: replay the committed golden fixtures against the
  # real pinned checkpoint. This is the only test that proves the port computes
  # the right model rather than merely a well-formed one, so it deserves to be a
  # job whose name says what failed.
  #
  # Kept off pull requests: it needs a ~925 MB download and several minutes even
  # warm. Structural invariants of the same code path --- flip antisymmetry, the
  # positivity clamp, batch/loop agreement, per-series truncation --- run without
  # any download on the LibTorch job above (test-timesfm-synthetic.R), so a PR is
  # not flying blind without this.
  parity:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    name: numerical parity (pinned checkpoint)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUK_RUN_CHECKPOINT_TEST: 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check

      - name: Install the LibTorch runtime
        run: Rscript -e 'torch::install_torch()'

      # Keyed on every pinned revision the tier covers, so the download happens
      # once and bumping any checkpoint invalidates the cache by construction
      # rather than by someone remembering to clear it. Derived rather than
      # written out: the previous hand-maintained key named only TimesFM and
      # silently re-downloaded the other two on every run.
      - name: Derive the cache key and download list from the catalogue
        id: checkpoints
        run: Rscript .github/scripts/checkpoint-tier.R >> "$GITHUB_OUTPUT"

      - name: Cache the pinned checkpoints
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.checkpoints.outputs.key }}

      # Explicit, and before the tests, so a Hub outage or a size mismatch fails
      # here with a download error instead of surfacing as a parity failure.
      # About 1.4 GB across the three.
      - name: Prefetch the checkpoints
        run: Rscript -e 'pkgload::load_all("."); for (id in strsplit("${{ steps.checkpoints.outputs.ids }}", ",")[[1]]) zuk_download(id)'

      - name: Run the checkpoint-gated suite
        run: Rscript -e 'testthat::test_local(".", stop_on_failure = TRUE)'
